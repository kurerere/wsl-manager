name: Release

on:
  push:
    tags: ["v*"]
  # 手动触发：只构建并上传 Actions 产物，不创建 Release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-amd64:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 按 rust-toolchain.toml 安装固定版本的工具链
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid version '$version', expected a tag like v1.2.3 or v1.2.3-beta.1"
          }
          # MSI (WiX) 不支持非数字的预发布版本号，预发布只出 NSIS 安装包
          $prerelease = $version.Contains('-')
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($prerelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version prerelease=$prerelease"

      - name: Set app version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.VERSION;c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - run: pnpm install --frozen-lockfile

      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ steps.version.outputs.prerelease }}" -eq "true") {
            pnpm tauri build --bundles nsis
          } else {
            pnpm tauri build
          }

      - name: Collect packages
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $out = "release"
          New-Item -ItemType Directory -Force $out | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          $name = "wsl-manager_${env:VERSION}_windows-amd64"
          $tag = "v$($env:VERSION)"

          $setup = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "$out/$name-setup.exe"
          $msi = Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi "$out/$name.msi" }
          Copy-Item "src-tauri/target/release/wsl-manager.exe" "$out/$name-portable.exe"

          $previousTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($LASTEXITCODE -eq 0 -and $previousTag) {
            $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.txt"
            $logScript = 'const fs=require("node:fs");const{execFileSync}=require("node:child_process");const log=execFileSync("git",["-c","i18n.logOutputEncoding=UTF-8","log",process.argv[1],"--format=%s"],{encoding:"utf8"}).trim();fs.writeFileSync(process.argv[2],log?log.split(/\r?\n/).map(subject=>"- "+subject).join("\n"):"","utf8");'
            & node -e $logScript "$previousTag..HEAD" $notesFile
            if ($LASTEXITCODE -eq 0) { $notes = [System.IO.File]::ReadAllText($notesFile, [System.Text.Encoding]::UTF8) }
          }
          if (-not $notes -or -not $notes.Trim()) { $notes = "WSL Manager v$($env:VERSION)" }

          $nsisSignature = [System.IO.File]::ReadAllText("$($setup.FullName).sig").Trim()
          $platforms = [ordered]@{
            "windows-x86_64" = [ordered]@{
              url = "https://github.com/kurerere/wsl-manager/releases/download/$tag/$name-setup.exe"
              signature = $nsisSignature
            }
            "windows-x86_64-nsis" = [ordered]@{
              url = "https://github.com/kurerere/wsl-manager/releases/download/$tag/$name-setup.exe"
              signature = $nsisSignature
            }
          }
          if ($msi) {
            $platforms["windows-x86_64-msi"] = [ordered]@{
              url = "https://github.com/kurerere/wsl-manager/releases/download/$tag/$name.msi"
              signature = [System.IO.File]::ReadAllText("$($msi.FullName).sig").Trim()
            }
          }
          $manifest = [ordered]@{
            version = $env:VERSION
            notes = $notes
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = $platforms
          }
          $manifestJson = $manifest | ConvertTo-Json -Depth 8
          [System.IO.File]::WriteAllText("$out/latest.json", $manifestJson, [System.Text.UTF8Encoding]::new($false))

          Get-ChildItem $out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$out/SHA256SUMS.txt" -Encoding utf8NoBOM
          Get-ChildItem $out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: wsl-manager_${{ steps.version.outputs.version }}_windows-amd64
          path: release/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem release -File).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # 重新运行时覆盖已上传的文件
            gh release upload $tag $files --clobber
          } else {
            $notes = @"
          ## 下载

          | 文件 | 说明 |
          |---|---|
          | ``*_windows-amd64-setup.exe`` | 安装包（推荐） |
          | ``*_windows-amd64.msi`` | MSI 安装包，适合批量部署（预发布版本不提供） |
          | ``*_windows-amd64-portable.exe`` | 免安装单文件，需要系统已有 WebView2 运行时（Windows 10/11 通常已内置） |

          运行环境：Windows 10/11 x64，已启用 WSL2。
          "@
            $flags = @()
            if ("${{ steps.version.outputs.prerelease }}" -eq "true") { $flags += "--prerelease" }
            gh release create $tag $files --title "WSL Manager $tag" --notes $notes --generate-notes @flags
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
